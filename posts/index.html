    <!-- Resolve the light/dark theme before first paint, so the page never
         flashes the wrong one. Falls back to the OS preference when the
         visitor hasn't chosen one explicitly (see the toggle button below). -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#121317' : '#f7f6f4');
            } catch (e) {}
        })();
    </script>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
        <svg class="theme-toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
            </path>
        </svg>
        <svg class="theme-toggle-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <script>
        (function () {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var mql = window.matchMedia('(prefers-color-scheme: dark)');

            function currentTheme() {
                return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            }

            function updateLabel() {
                var theme = currentTheme();
                btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#121317' : '#f7f6f4');
            }

            updateLabel();

            btn.addEventListener('click', function () {
                var next = currentTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
                updateLabel();
            });

            mql.addEventListener('change', function (e) {
                var stored;
                try { stored = localStorage.getItem('theme'); } catch (err) { stored = null; }
                if (!stored) {
                    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                    updateLabel();
                }
            });
        })();
    </script>
